services:
  bed-server:
    build: .
    environment:
      DB_NAME: master
      DB_USER: sa
      DB_PASSWORD: Supergigastrongpassword123!321
      DB_HOST: mssql
      DB_PORT: 1433
    ports:
      - "3000:3000"
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Supergigastrongpassword123!321
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Supergigastrongpassword123!321' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql_data:
